name: Recovery Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Work
      uses: actions/checkout@v4

    - name: Prepare Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Initialize and Sync Minimal AOSP
      run: |
        git config --global user.name "thrallbrandon829-eng"
        git config --global user.email "thrallbrandon829-eng@github.com"
        git config --global color.ui false
        
        # Download a guaranteed standalone Python execution binary directly into the virtual runner environment
        mkdir -p ~/bin
        curl -sL "https://googlesource.com" | base64 --decode > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH
        
        mkdir -p workspace
        cd workspace
        
        # Run initialization using the clean standalone Python runtime link directly
        python3 ~/bin/repo init --no-clone-bundle --no-pager -u https://github.com -b twrp-12.1
        python3 ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --prune

    - name: Inject Personal Device Configs
      run: |
        mkdir -p workspace/device/motorola/kansas
        cp -r motorola/kansas/* workspace/device/motorola/kansas/
        
        mkdir -p workspace/vendor/motorola/kansas
        cp -r vendor/motorola/kansas/* workspace/vendor/motorola/kansas/

    - name: Execute TWRP Compilation Run
      run: |
        cd workspace
        source build/envsetup.sh
        lunch twrp_kansas-eng || lunch omni_kansas-eng
        make recoveryimage -j$(nproc --all)

    - name: Upload Finished Recovery Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: twrp-kansas-image
        path: workspace/out/target/product/kansas/*.img
